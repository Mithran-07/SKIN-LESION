<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <rect x="20" y="20" width="1160" height="380" rx="24" fill="#ffffff" stroke="#d1d5db"/>
  <text x="60" y="70" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">Conformal Prediction Workflow</text>
  <rect x="60" y="155" width="180" height="95" rx="16" fill="#dbeafe" stroke="#2563eb"/>
  <text x="150" y="196" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22">Calibration</text>
  <text x="150" y="222" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18">Held-out set</text>
  <rect x="300" y="155" width="180" height="95" rx="16" fill="#dcfce7" stroke="#16a34a"/>
  <text x="390" y="196" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22">Nonconformity</text>
  <text x="390" y="222" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18">scores</text>
  <rect x="540" y="155" width="180" height="95" rx="16" fill="#fef3c7" stroke="#d97706"/>
  <text x="630" y="196" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22">Threshold</text>
  <text x="630" y="222" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18">q̂</text>
  <rect x="780" y="155" width="180" height="95" rx="16" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="870" y="196" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22">Prediction Set</text>
  <text x="870" y="222" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18">{y : s(y) ≤ q̂}</text>
  <rect x="1020" y="155" width="120" height="95" rx="16" fill="#ffe4e6" stroke="#e11d48"/>
  <text x="1080" y="196" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22">Coverage</text>
  <text x="1080" y="222" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18">≥ 1 − α</text>
  <line x1="240" y1="202" x2="300" y2="202" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="480" y1="202" x2="540" y2="202" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="720" y1="202" x2="780" y2="202" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="960" y1="202" x2="1020" y2="202" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
