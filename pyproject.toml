[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

# ---------------------------------------------------------------------------
# Project Metadata
# ---------------------------------------------------------------------------
[project]
name = "dual-branch-derm"
version = "1.0.0"
description = "Dual-Branch CNN Framework for Non-Melanoma Dermoscopic Classification"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
keywords = ["deep-learning", "dermoscopy", "skin-cancer", "pytorch", "medical-ai"]

# ---------------------------------------------------------------------------
# Ruff — Linter + Formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["."]
exclude = [".venv", "__pycache__", "*.egg-info", ".git"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "D",   # pydocstyle
]
ignore = [
    "D100", "D101", "D102", "D104", "D105",  # Missing docstrings in some locations
    "D203", "D213",  # Conflicting docstring rules
    "B008",          # Do not perform function calls in default arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "N"]    # Relax docstring and naming rules in tests
"scripts/*" = ["D"]

# ---------------------------------------------------------------------------
# Mypy — Static Type Checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
exclude = [".venv", "notebooks"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["."]
omit = [
    ".venv/*",
    "tests/*",
    "notebooks/*",
    "scripts/*",
    "setup.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60
